[project]
name = "agent-lab"
version = "0.1.0"
description = "Personal AI Agent Lab: a minimal, reusable PydanticAI agent runtime (Phase 1)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[google]>=2.60,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-lab = "agent_lab.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"agent_lab.agents.calm_down.fixtures" = ["*.json"]
