# EXAMPLE ONLY - not included in kustomization.yaml and never applied by CI.
# Prefer creating the secret from the command line so the key never touches a file:
#   kubectl -n agent-lab create secret generic agent-lab-secrets --from-literal=GEMINI_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: agent-lab-secrets
  namespace: agent-lab
type: Opaque
stringData:
  GEMINI_API_KEY: "replace-me"
